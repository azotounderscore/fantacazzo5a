<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0aa05e">
<title>FantaPelliccia — Fantaclassepallavolo</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
</head>
<body>

<!-- Schermata login / registrazione -->
<div id="auth" class="hidden"></div>

<!-- App principale -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="logo">🏐 <span>FantaPelliccia</span></div>
    <div id="topbar-user" class="topbar-user"></div>
  </header>

  <main id="page"></main>

  <nav class="bottomnav">
    <button class="nav-btn active" data-tab="classifica">
      <span class="nav-ico">🏆</span><span>Classifica</span>
    </button>
    <button class="nav-btn" data-tab="squadra">
      <span class="nav-ico">👥</span><span>Squadra</span>
    </button>
    <button class="nav-btn" data-tab="profilo">
      <span class="nav-ico">👤</span><span>Profilo</span>
    </button>
  </nav>
</div>

<!-- Pannello admin (overlay a tutto schermo) -->
<div id="admin" class="admin-overlay hidden"></div>

<!-- Notifica -->
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/players-seed.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
